<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>にゃんこの森｜腸活（試作・森テーマ）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --cream:#fdf5e3; --cream-d:#efe1bd; --wood:#c98b52; --wood-d:#a86c38;
    --ink:#6b5636; --ink-soft:#a08a63;
    --leaf:#7cc242; --leaf-d:#5fa32e; --leaf-deep:#4f7a2a;
    --sky1:#bfeaf0; --sky2:#e6f7 ; --grass:#9bd36b; --grass-d:#7cbb4f;
    --bell:#f4c430; --bell-d:#e0a800;
    --heart:#ff7a9c; --pink:#ffd3df;
  }
  body{font-family:'M PLUS Rounded 1c',sans-serif;background:
    radial-gradient(circle at 20% 0%,#fef7e6,transparent 60%),
    #f3ead0;
    color:var(--ink);min-height:100vh;padding:0 0 92px;font-weight:700;}
  main{max-width:460px;margin:0 auto;padding:14px 14px 0;}

  /* wooden sign header */
  .sign{position:relative;margin:6px auto 14px;max-width:300px;background:linear-gradient(180deg,#e7b477,var(--wood));
    border:4px solid #fff;border-radius:22px;box-shadow:0 5px 0 var(--wood-d),0 8px 12px rgba(120,80,40,.25);
    text-align:center;padding:11px 20px;}
  .sign h1{font-family:'Mochiy Pop One',sans-serif;font-size:20px;color:#fff;letter-spacing:.04em;text-shadow:0 2px 0 rgba(120,80,40,.35);}
  .sign:before,.sign:after{content:"🍃";position:absolute;top:50%;transform:translateY(-50%);font-size:20px;}
  .sign:before{left:-6px;transform:translateY(-50%) rotate(-20deg);}
  .sign:after{right:-6px;transform:translateY(-50%) scaleX(-1) rotate(-20deg);}

  /* bells pouch */
  .bells{position:fixed;top:12px;right:14px;z-index:20;display:flex;align-items:center;gap:5px;
    background:#fff;border:3px solid var(--cream-d);border-radius:22px;padding:5px 13px 5px 9px;
    box-shadow:0 3px 0 var(--cream-d);font-size:15px;color:var(--bell-d);font-weight:900;}
  .bells .lf{font-size:16px;}

  /* ===== scene ===== */
  .scene{position:relative;width:100%;aspect-ratio:1/1;border-radius:26px;overflow:hidden;
    border:5px solid #fff;box-shadow:0 6px 0 var(--cream-d),0 10px 16px rgba(120,90,40,.16);}
  .sky{position:absolute;inset:0;background:linear-gradient(180deg,#bfeaf0 0%,#dff5ee 55%,#e9f8dd 72%);}
  .sun{position:absolute;top:9%;right:12%;width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle,#fff3b0,#ffde5c);box-shadow:0 0 0 10px rgba(255,222,92,.28),0 0 34px rgba(255,222,92,.5);}
  .cloud{position:absolute;background:#fff;border-radius:40px;opacity:.95;filter:drop-shadow(0 3px 4px rgba(150,170,180,.25));}
  .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .c1{width:66px;height:22px;top:14%;left:10%;animation:drift 22s linear infinite;}
  .c1:before{width:30px;height:30px;top:-13px;left:10px;}.c1:after{width:24px;height:24px;top:-9px;left:34px;}
  .c2{width:50px;height:18px;top:28%;left:60%;animation:drift 30s linear infinite;}
  .c2:before{width:24px;height:24px;top:-11px;left:8px;}.c2:after{width:18px;height:18px;top:-6px;left:26px;}
  @keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(30px)}}

  .hill{position:absolute;left:50%;border-radius:50%;transform:translateX(-50%);}
  .hill-b{width:150%;height:46%;bottom:24%;background:#b6e08a;}
  .hill-a{width:170%;height:40%;bottom:10%;background:#9ed46f;}
  .grass{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,var(--grass),var(--grass-d));}
  .grass:before{content:"";position:absolute;top:-6px;left:0;right:0;height:12px;
    background:radial-gradient(circle at 8px 10px,var(--grass) 6px,transparent 7px) 0 0/16px 12px repeat-x;}
  .tree{position:absolute;bottom:26%;font-size:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12));}
  .flower{position:absolute;font-size:19px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1));}

  .cat-holder{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:48%;z-index:6;cursor:pointer;}
  .cat-holder svg{width:100%;height:auto;display:block;overflow:visible;}
  .bob{animation:bob 2.8s ease-in-out infinite;transform-origin:50% 92%;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3%) rotate(-1deg)}}
  .pop{animation:pop .5s ease;}
  @keyframes pop{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg) scale(1.04)}70%{transform:rotate(6deg) scale(1.04)}}

  /* speech bubble */
  .bubble{position:absolute;left:50%;top:8%;transform:translateX(-50%);z-index:7;
    background:#fff;border:3px solid var(--cream-d);border-radius:18px;padding:9px 15px;
    font-size:13.5px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--cream-d);white-space:nowrap;max-width:88%;}
  .bubble:after{content:"";position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
    border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #fff;}
  .bubble:before{content:"";position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);
    border-left:11px solid transparent;border-right:11px solid transparent;border-top:13px solid var(--cream-d);}
  .heart-p{position:absolute;z-index:8;pointer-events:none;font-size:20px;animation:hp 1s ease forwards;}
  @keyframes hp{0%{opacity:0;transform:translateY(0) scale(.4)}25%{opacity:1;transform:translateY(-12px) scale(1.1)}100%{opacity:0;transform:translateY(-58px)}}

  /* name plate */
  .plate{margin:14px auto 0;background:#fff;border:3px solid var(--cream-d);border-radius:20px;
    box-shadow:0 4px 0 var(--cream-d);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
  .plate .nm{font-family:'Mochiy Pop One',sans-serif;font-size:18px;color:var(--ink);}
  .plate .hearts{font-size:16px;letter-spacing:1px;}
  .plate .friend{font-size:11px;color:var(--ink-soft);font-weight:800;margin-top:2px;}

  /* stat leaves */
  .stats{display:flex;gap:10px;margin-top:12px;}
  .stat{flex:1;background:#fff;border:3px solid var(--cream-d);border-radius:20px;padding:12px 6px 11px;
    text-align:center;box-shadow:0 4px 0 var(--cream-d);position:relative;}
  .stat .cap{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;
    padding:2px 10px;border-radius:20px;white-space:nowrap;}
  .stat.a .cap{background:#a678e0;}.stat.b .cap{background:var(--leaf-d);}.stat.c .cap{background:var(--bell-d);}
  .stat .ic{font-size:22px;line-height:1;margin-top:4px;}
  .stat .v{font-family:'Mochiy Pop One',sans-serif;font-size:19px;margin-top:3px;}
  .stat.a .v{color:#8a63d2;}.stat.b .v{color:var(--leaf-deep);}.stat.c .v{color:var(--bell-d);}
  .stat .u{font-size:10px;color:var(--ink-soft);font-weight:800;}

  .btn{width:100%;margin-top:16px;background:linear-gradient(180deg,#9be05f,var(--leaf-d));color:#fff;
    border:4px solid #fff;border-radius:22px;padding:15px;font-family:'Mochiy Pop One',sans-serif;font-size:17px;
    letter-spacing:.04em;cursor:pointer;box-shadow:0 5px 0 var(--leaf-deep),0 8px 12px rgba(80,120,40,.2);
    text-shadow:0 2px 0 rgba(70,110,30,.3);transition:transform .08s,box-shadow .08s;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-deep);}

  .note{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;margin:14px 4px 0;line-height:1.7;}

  /* bottom nav */
  .nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:30;
    display:flex;gap:6px;background:#fff;border:3px solid var(--cream-d);border-radius:26px;
    padding:6px;box-shadow:0 5px 0 var(--cream-d),0 8px 14px rgba(120,90,40,.16);}
  .nav button{border:none;background:none;font-family:inherit;font-weight:800;font-size:10.5px;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 13px;border-radius:20px;cursor:pointer;}
  .nav button .i{font-size:19px;line-height:1;}
  .nav button.on{background:linear-gradient(180deg,#c9f0a0,#a9dd7a);color:var(--leaf-deep);}

  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);
    background:var(--wood);color:#fff;font-weight:800;font-size:13px;padding:11px 18px;border-radius:20px;
    border:3px solid #fff;box-shadow:0 4px 0 var(--wood-d);z-index:40;opacity:0;transition:.3s;pointer-events:none;max-width:86%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="bells"><span class="lf">🔔</span><span id="bells">1,240</span></div>

<main>
  <div class="sign"><h1>にゃんこの森</h1></div>

  <div class="scene" id="scene">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="hill hill-b"></div><div class="hill hill-a"></div>
    <div class="tree" style="left:6%">🌳</div>
    <div class="tree" style="right:5%;bottom:28%;font-size:30px">🌳</div>
    <div class="tree" style="left:24%;bottom:29%;font-size:22px">🌲</div>
    <div class="grass"></div>
    <div class="flower" style="left:12%;bottom:8%">🌷</div>
    <div class="flower" style="right:14%;bottom:6%">🌼</div>
    <div class="flower" style="left:32%;bottom:4%">🌸</div>
    <div class="flower" style="right:30%;bottom:9%;font-size:16px">🍀</div>
    <div class="bubble" id="bubble">きょうのごはん なにかな？🍃</div>
    <div class="cat-holder" id="cat"><div class="bob" id="catArt"></div></div>
  </div>

  <div class="plate">
    <div>
      <div class="nm">ネコタ</div>
      <div class="friend">なかよし度：だいすき</div>
    </div>
    <div class="hearts">❤️❤️❤️❤️🤍</div>
  </div>

  <div class="stats">
    <div class="stat a"><span class="cap">乳酸菌</span><div class="ic">🦠</div><div class="v">5</div><div class="u">スコア</div></div>
    <div class="stat b"><span class="cap">食物繊維</span><div class="ic">🌿</div><div class="v">18<span style="font-size:11px">g</span></div><div class="u">きょう</div></div>
    <div class="stat c"><span class="cap">腸活P</span><div class="ic">✨</div><div class="v">132</div><div class="u">ポイント</div></div>
  </div>

  <button class="btn" id="feed">🍽 ごはんをあげる</button>

  <div class="note">※ みんなの森（どうぶつの森）風テーマの試作トップ画面です。<br>猫をタップ／ボタンでちょっと反応します 🐾</div>
</main>

<nav class="nav">
  <button class="on"><span class="i">🏡</span>おうち</button>
  <button><span class="i">🍽️</span>ごはん</button>
  <button><span class="i">🛍️</span>おみせ</button>
  <button><span class="i">📖</span>きろく</button>
</nav>

<div class="toast" id="toast"></div>

<script>
// かわいい子猫SVG（頭に葉っぱ＝森テーマ）
function catSVG(mood){
  const coat='#ffd9a8',coatDark='#f2b982';
  let eyes,mouth;
  if(mood==='great'){
    eyes='<path d="M78 96 q7 -11 14 0" stroke="#6b5636" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M108 96 q7 -11 14 0" stroke="#6b5636" stroke-width="4" fill="none" stroke-linecap="round"/>';
    mouth='<path d="M92 112 q8 9 16 0" stroke="#6b5636" stroke-width="3" fill="none" stroke-linecap="round"/>';
  }else{
    eyes='<circle cx="85" cy="97" r="6.5" fill="#6b5636"/><circle cx="115" cy="97" r="6.5" fill="#6b5636"/><circle cx="87" cy="94" r="2" fill="#fff"/><circle cx="117" cy="94" r="2" fill="#fff"/>';
    mouth='<path d="M94 110 q6 6 12 0" stroke="#6b5636" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  }
  return `<svg viewBox="0 0 200 200">
    <ellipse cx="100" cy="184" rx="46" ry="9" fill="rgba(80,60,30,.10)"/>
    <path d="M142 170 q34 6 30 -30 q-3 -20 -18 -18" fill="none" stroke="${coatDark}" stroke-width="13" stroke-linecap="round"/>
    <path d="M58 184 C50 132 66 120 100 120 C134 120 150 132 142 184 Z" fill="${coat}"/>
    <ellipse cx="80" cy="182" rx="12" ry="7.5" fill="${coatDark}"/><ellipse cx="120" cy="182" rx="12" ry="7.5" fill="${coatDark}"/>
    <path d="M60 72 L54 28 L96 58 Z" fill="${coat}"/><path d="M140 72 L146 28 L104 58 Z" fill="${coat}"/>
    <path d="M64 64 L61 40 L86 58 Z" fill="#ffb3c6"/><path d="M136 64 L139 40 L114 58 Z" fill="#ffb3c6"/>
    <circle cx="100" cy="94" r="42" fill="${coat}"/>
    <ellipse cx="70" cy="106" rx="9" ry="7" fill="#ffc9d8" opacity=".6"/><ellipse cx="130" cy="106" rx="9" ry="7" fill="#ffc9d8" opacity=".6"/>
    ${eyes}
    <path d="M96 106 h8 l-4 5 Z" fill="#ff9db0"/>
    ${mouth}
    <path d="M64 102 h-22 M66 110 h-20" stroke="${coatDark}" stroke-width="2" stroke-linecap="round"/>
    <path d="M136 102 h22 M134 110 h20" stroke="${coatDark}" stroke-width="2" stroke-linecap="round"/>
    <!-- 森テーマの葉っぱ -->
    <g transform="translate(112 44) rotate(24)"><path d="M0 0 Q16 -10 30 2 Q16 10 0 0 Z" fill="#7cc242"/><path d="M2 0 H26" stroke="#5fa32e" stroke-width="1.6"/></g>
  </svg>`;
}
const catArt=document.getElementById('catArt');
catArt.innerHTML=catSVG('good');

const lines=['きょうのごはん なにかな？🍃','なでてくれて ありがとニャ💕','はっこうしょくひん だいすき！','おなか よろこんでる〜♪','いっしょに 腸活しよ🐾'];
let li=0;
function heart(x,y){const s=document.getElementById('scene'),r=s.getBoundingClientRect();
  const h=document.createElement('div');h.className='heart-p';h.textContent=['💚','💛','💕','🍃'][Math.floor(Math.random()*4)];
  h.style.left=((x??r.width/2)-10)+'px';h.style.top=((y??r.height*0.45)-10)+'px';s.appendChild(h);setTimeout(()=>h.remove(),1000);}
function react(ev){
  catArt.innerHTML=catSVG('great');
  catArt.classList.remove('bob','pop');void catArt.offsetWidth;catArt.classList.add('pop');
  const s=document.getElementById('scene').getBoundingClientRect();
  let x,y;if(ev&&ev.clientX){x=ev.clientX-s.left;y=ev.clientY-s.top;}
  heart(x,y);
  li=(li+1)%lines.length;document.getElementById('bubble').textContent=lines[li];
  setTimeout(()=>{catArt.classList.remove('pop');catArt.classList.add('bob');catArt.innerHTML=catSVG('good');},700);
}
document.getElementById('cat').addEventListener('click',react);
let tT;
document.getElementById('feed').addEventListener('click',()=>{
  react();heart();
  const t=document.getElementById('toast');t.textContent='ごはんをあげた！ 腸活P +20 ✨';t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2000);
});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
</script>
</body>
</html>
