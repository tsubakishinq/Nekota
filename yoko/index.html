<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEKOTA GEO — 横スクロール猫シューティング</title>
<style>
  :root{ --neon:#57f6ff; --neon2:#ff5ec9; --gold:#ffd85e; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#03030c; color:#eaf6ff; font-family:"Trebuchet MS","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    overflow:hidden; display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none;}
  #wrap{position:relative; width:100vw; height:100vh; overflow:hidden; background:#03030c;}
  canvas{display:block; position:absolute; left:0; top:0; image-rendering:pixelated;}

  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; padding:22px; z-index:20;
    background:radial-gradient(circle at 50% 30%, rgba(11,10,36,.4), rgba(3,3,12,.9)); backdrop-filter:blur(2px);}
  .overlay.hidden{display:none;}
  .logo{font-size:clamp(30px,9vw,60px); font-weight:900; letter-spacing:3px; line-height:.95;
    background:linear-gradient(180deg,#fff,var(--neon) 55%,var(--neon2)); -webkit-background-clip:text; background-clip:text;
    color:transparent; filter:drop-shadow(0 0 16px rgba(87,246,255,.55));}
  .logo small{display:block; font-size:clamp(10px,3vw,15px); letter-spacing:7px; margin-top:6px; color:var(--gold);
    -webkit-text-fill-color:var(--gold);}
  .btn{font:inherit; font-weight:800; letter-spacing:2px; font-size:clamp(15px,4vw,20px); color:#04030f;
    background:linear-gradient(180deg,#aefcff,var(--neon)); border:none; cursor:pointer; padding:13px 38px; border-radius:40px;
    box-shadow:0 0 22px rgba(87,246,255,.6),0 5px 0 #1d7f88;}
  .btn:active{transform:translateY(3px); box-shadow:0 0 22px rgba(87,246,255,.6),0 2px 0 #1d7f88;}
  .btn.pink{background:linear-gradient(180deg,#ffb8e6,var(--neon2)); box-shadow:0 0 22px rgba(255,94,201,.6),0 5px 0 #8f2f6c;}
  .panel{max-width:520px; background:rgba(9,12,34,.6); border:1px solid rgba(87,246,255,.22); border-radius:14px;
    padding:12px 18px; font-size:clamp(11px,3vw,14px); line-height:1.7; color:#bcd6ff;}
  .panel b{color:var(--neon);} .hs{color:var(--gold); font-weight:800; letter-spacing:1px;}
  .go-title{font-size:clamp(26px,7vw,46px); font-weight:900; letter-spacing:3px; color:var(--neon2);
    filter:drop-shadow(0 0 12px rgba(255,94,201,.6));}
  .stat-row{display:flex; gap:24px; justify-content:center; flex-wrap:wrap;}
  .stat .v{font-size:clamp(20px,6vw,32px); font-weight:900; color:#fff;} .stat .l{font-size:10px; letter-spacing:3px; color:#7f95c9;}
  .rotate{font-size:12px; color:var(--gold); letter-spacing:1px; opacity:.9;}

  /* touch controls */
  #touch{position:absolute; inset:0; z-index:10; display:none; pointer-events:none;}
  body.touch #touch{display:block;}
  #dpad{pointer-events:auto; position:absolute; left:14px; bottom:16px; width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle at 50% 45%, rgba(30,38,72,.55), rgba(9,12,34,.45)); border:2px solid rgba(87,246,255,.28);
    box-shadow:0 0 16px rgba(87,246,255,.14) inset; touch-action:none;}
  #dpad .arm{position:absolute; left:50%; top:50%; color:var(--neon); font-size:14px; font-weight:900; transform:translate(-50%,-50%); opacity:.8;}
  #dpad .arm.u{top:14%;} #dpad .arm.d{top:86%;} #dpad .arm.l{left:14%;} #dpad .arm.r{left:86%;}
  #dnub{position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#8be9ff,#2b7bd6); box-shadow:0 0 16px rgba(87,246,255,.5);}
  #powBtn{pointer-events:auto; position:absolute; right:20px; bottom:24px; width:86px; height:86px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#ffe7a0,var(--gold) 70%); box-shadow:0 0 22px rgba(255,216,94,.6), inset 0 0 18px rgba(255,255,255,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:#3a2c00; font-weight:900; letter-spacing:1px; font-size:14px;
    border:2px solid rgba(255,255,255,.4); line-height:1.1;}
  #powBtn small{font-size:8px; opacity:.85;}
  #powBtn:active{transform:scale(.93);}
  .pauseBtn{position:absolute; top:10px; right:12px; z-index:16; width:38px; height:38px; border-radius:9px;
    background:rgba(9,12,34,.55); border:1px solid rgba(87,246,255,.3); color:var(--neon); font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #soundBtn{right:auto; left:12px;}
  .toast{position:absolute; left:50%; top:12%; transform:translateX(-50%); z-index:14; font-weight:900; letter-spacing:2px;
    font-size:clamp(15px,4vw,22px); pointer-events:none; opacity:0; text-shadow:0 0 12px currentColor;}
</style>

<div id="wrap">
  <canvas id="game"></canvas>
  <div class="pauseBtn" id="pauseBtn" style="display:none">❚❚</div>
  <div class="pauseBtn" id="soundBtn">🔊</div>
  <div class="toast" id="toast"></div>

  <div id="touch">
    <div id="dpad"><span class="arm u">▲</span><span class="arm d">▼</span><span class="arm l">◀</span><span class="arm r">▶</span><div id="dnub"></div></div>
    <div id="powBtn"><span>POWER</span><small id="powHint">かいほう</small></div>
  </div>

  <div class="overlay" id="titleScreen">
    <div class="logo">NEKOTA GEO<small>Y O K O &nbsp; S C R O L L</small></div>
    <div class="panel">
      横スクロール猫シューティング！ 敵は右から来るぞ。<br>
      <b>🐾カプセル</b>を集めて <b>POWER</b> でパワーアップ（グラディウス式）。<br>
      スピード → ミサイル → ダブル → レーザー → オプション → シールド
    </div>
    <button class="btn" id="startBtn">▶ START</button>
    <div class="panel">
      <b>操作</b>　移動：左下の十字キー / <span>← →↑↓</span>（ショットは自動）<br>
      パワーアップ発動：右下 <b>POWER</b>ボタン（PCは <b>X</b>）／ポーズ：P
    </div>
    <div class="rotate">📱 スマホは横向きがおすすめ</div>
    <div class="hs" id="titleHigh"></div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="go-title" id="goTitle">GAME OVER</div>
    <div class="stat-row">
      <div class="stat"><div class="v" id="finalScore">0</div><div class="l">SCORE</div></div>
      <div class="stat"><div class="v" id="finalDist">0</div><div class="l">DISTANCE</div></div>
    </div>
    <div class="hs" id="overHigh"></div>
    <button class="btn pink" id="retryBtn">↻ RETRY</button>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="logo" style="font-size:clamp(26px,8vw,44px)">PAUSED</div>
    <button class="btn" id="resumeBtn">▶ RESUME</button>
    <button class="btn pink" id="quitBtn" style="font-size:14px;padding:9px 24px">■ QUIT</button>
  </div>
</div>

<script>
"use strict";
(function(){
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
// landscape logical world
const W=960, H=540;
let scaleX=1, scaleY=1, offX=0, offY=0;
function resize(){
  const ww=window.innerWidth, wh=window.innerHeight;
  cv.width=Math.round(ww*DPR); cv.height=Math.round(wh*DPR);
  cv.style.width=ww+'px'; cv.style.height=wh+'px';
  // fit W×H into screen keeping aspect, letterbox
  const s=Math.min(cv.width/W, cv.height/H);
  scaleX=scaleY=s; offX=(cv.width-W*s)/2; offY=(cv.height-H*s)/2;
}
window.addEventListener('resize', resize);

// ================= AUDIO =================
const Audio2=(function(){
  let actx=null,master=null,musicGain=null,sfxGain=null,enabled=true;
  function init(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
    musicGain=actx.createGain(); musicGain.gain.value=0.22; musicGain.connect(master);
    sfxGain=actx.createGain(); sfxGain.gain.value=0.5; sfxGain.connect(master);
  }catch(e){ enabled=false; } }
  function resume(){ if(actx&&actx.state==='suspended') actx.resume(); }
  function beep(f,d,t,g,sl){ if(!enabled||!actx)return; const o=actx.createOscillator(),ga=actx.createGain();
    o.type=t||'square'; o.frequency.value=f; if(sl)o.frequency.exponentialRampToValueAtTime(sl,actx.currentTime+d);
    ga.gain.value=0.0001; ga.gain.exponentialRampToValueAtTime(g||0.3,actx.currentTime+0.01);
    ga.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d); o.connect(ga); ga.connect(sfxGain); o.start(); o.stop(actx.currentTime+d+0.02); }
  function noise(d,g,ff){ if(!enabled||!actx)return; const n=Math.floor(actx.sampleRate*d); const buf=actx.createBuffer(1,n,actx.sampleRate);
    const da=buf.getChannelData(0); for(let i=0;i<n;i++)da[i]=(Math.random()*2-1)*(1-i/n);
    const s=actx.createBufferSource(); s.buffer=buf; const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ff||1400;
    const ga=actx.createGain(); ga.gain.value=g||0.3; s.connect(f); f.connect(ga); ga.connect(sfxGain); s.start(); }
  const sfx={ shoot(){beep(760,.07,'square',0.1,1200);}, laser(){beep(1150,.08,'sawtooth',0.1,420);},
    hit(){beep(240,.05,'square',0.09);}, explode(){noise(.3,0.4,900); beep(110,.28,'triangle',0.22,40);},
    big(){noise(.6,0.55,700); beep(85,.55,'triangle',0.4,30);}, power(){beep(600,.09,'sine',0.28,940); setTimeout(()=>beep(940,.1,'sine',0.24,1300),70);},
    coin(){beep(1250,.06,'square',0.16,1650);}, hurt(){noise(.24,0.4,500); beep(170,.24,'sawtooth',0.3,60);},
    warn(){beep(200,.5,'sawtooth',0.28,120);}, select(){beep(700,.07,'square',0.2,1000);}, up(){beep(500,.09,'square',0.22); setTimeout(()=>beep(760,.14,'square',0.24),80);} };
  let mt=null,step=0; const scale=[0,3,5,7,10,12], roots=[196,146.83,174.61,164.81];
  function mNote(f,t,d,g){ if(!actx)return; const o=actx.createOscillator(),ga=actx.createGain(); o.type=t; o.frequency.value=f;
    ga.gain.value=0.0001; ga.gain.exponentialRampToValueAtTime(g,actx.currentTime+0.02); ga.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
    o.connect(ga); ga.connect(musicGain); o.start(); o.stop(actx.currentTime+d+0.05); }
  function startMusic(){ if(!enabled||!actx||mt)return; step=0; const tick=()=>{ const r=roots[Math.floor(step/8)%roots.length];
    if(step%2===0) mNote(r/2,'triangle',0.14,.26); mNote(r*Math.pow(2,scale[(step*3)%scale.length]/12),'square',0.05,.12);
    step++; mt=setTimeout(tick,170); }; tick(); }
  function stopMusic(){ if(mt){clearTimeout(mt); mt=null;} }
  return { init,resume,sfx,startMusic,stopMusic, isEnabled:()=>enabled, setMuted:m=>{ if(master)master.gain.value=m?0:0.9; }, toggle(){enabled=!enabled; if(!enabled)stopMusic(); return enabled;} };
})();

// ================= UTIL =================
const rnd=(a,b)=>a+Math.random()*(b-a), rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v, TAU=Math.PI*2;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const pick=a=>a[rndi(0,a.length-1)];

const stars=[], bullets=[], enemies=[], eBullets=[], particles=[], powerups=[], texts=[], options=[], missiles=[];

// ================= STARS / BG =================
function initStars(){ stars.length=0; for(let i=0;i<130;i++){ const layer=rndi(0,2);
  stars.push({x:rnd(0,W),y:rnd(0,H),layer, s:layer===0?rnd(.5,1):layer===1?rnd(1,1.7):rnd(1.7,2.6),
    v:layer===0?rnd(40,70):layer===1?rnd(90,140):rnd(170,240), hue:Math.random()<.15?rnd(180,320):rnd(200,240), tw:Math.random()*TAU}); } }
function updateStars(dt){ const boost=1+(player.alive?player.speedLvl*0.12:0);
  for(const s of stars){ s.x-=s.v*dt*boost; if(s.x<-2){ s.x=W+2; s.y=rnd(0,H);} s.tw+=dt*3; } }
function drawStars(){ for(const s of stars){ const a=0.4+0.6*Math.abs(Math.sin(s.tw));
  ctx.fillStyle=`hsla(${s.hue},80%,${60+s.layer*8}%,${a*(0.5+s.layer*0.25)})`; ctx.fillRect(s.x,s.y,s.s*(s.layer===2?2.4:1.6),s.s); } }
let terrScroll=0;
function drawTerrain(){ // うっすら上下の地形ライン
  terrScroll=(terrScroll+ (player.alive?(120+player.speedLvl*14):120)* (1/60))% 120;
  ctx.strokeStyle='rgba(87,140,220,.16)'; ctx.lineWidth=2;
  for(let row=0;row<2;row++){ const baseY=row?H-6:6; ctx.beginPath();
    for(let x=-120;x<=W+120;x+=40){ const xx=x-terrScroll; const yy=baseY+(row?-1:1)*(8+Math.sin((x)*0.03)*6);
      ctx[x===-120?'moveTo':'lineTo'](xx,yy); } ctx.stroke(); }
}

// ================= PARTICLES / TEXT =================
function spawnParticles(x,y,color,n,spd,life){ for(let i=0;i<n;i++){ const a=Math.random()*TAU,s=rnd(spd*0.3,spd);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*0.6,life),max:life,color,size:rnd(1.5,3.6)}); } }
function updateParticles(dt){ for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; if(p.life<=0){particles.splice(i,1);continue;}
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.95; p.vy*=0.95; } }
function drawParticles(){ ctx.globalCompositeOperation='lighter'; for(const p of particles){ const a=clamp(p.life/p.max,0,1);
  ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.4+a),0,TAU); ctx.fill(); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
function spawnText(x,y,txt,color,size){ texts.push({x,y,txt,color,size:size||16,life:1,vy:-30}); }
function updateTexts(dt){ for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.life-=dt*1.1; t.y+=t.vy*dt; t.vy*=0.94; if(t.life<=0)texts.splice(i,1);} }
function drawTexts(){ ctx.textAlign='center'; ctx.textBaseline='middle'; for(const t of texts){ ctx.globalAlpha=clamp(t.life,0,1);
  ctx.font=`900 ${t.size}px "Trebuchet MS",sans-serif`; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.strokeText(t.txt,t.x,t.y);
  ctx.fillStyle=t.color; ctx.fillText(t.txt,t.x,t.y);} ctx.globalAlpha=1; }

// ================= PLAYER =================
const BASE_SPEED=210;
const player={ x:170, y:H/2, r:15, alive:true, invuln:0, thrust:0,
  fireCd:0, shotMode:'single', // single/double/laser
  speedLvl:0, // 0..5
  hasMissile:false, shield:0, dead:false };
function resetPlayer(){ player.x=170; player.y=H/2; player.alive=true; player.invuln=1.2; player.fireCd=0;
  player.shotMode='single'; player.speedLvl=0; player.hasMissile=false; player.shield=0; }
function playerSpeed(){ return BASE_SPEED*(1+player.speedLvl*0.22); }

// power-up bar (Gradius)
const POWERS=['SPEED','MISSILE','DOUBLE','LASER','OPTION','SHIELD'];
const POWJP=['スピード','ミサイル','ダブル','レーザー','オプション','シールド'];
let powerCursor=0; // 0=none, 1..6 lit slot

const dpad={active:false,dx:0,dy:0};
function updatePlayer(dt){
  if(!player.alive) return;
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a']) dx-=1; if(keys['arrowright']||keys['d']) dx+=1;
  if(keys['arrowup']||keys['w']) dy-=1; if(keys['arrowdown']||keys['s']) dy+=1;
  if(dpad.active&&(dpad.dx||dpad.dy)){ dx=dpad.dx; dy=dpad.dy; }
  const len=Math.hypot(dx,dy)||1; const sp=playerSpeed();
  player.x+=dx/len*sp*dt; player.y+=dy/len*sp*dt;
  player.thrust=(dx||dy)?1:0.4;
  player.x=clamp(player.x,player.r+4, W*0.62); player.y=clamp(player.y,player.r+8,H-player.r-8);
  if(player.invuln>0) player.invuln-=dt;
  if(player.shield>0) player.shield-=dt;
  // auto fire
  player.fireCd-=dt;
  if(player.fireCd<=0){ fire(); }
  // options follow (trail)
  optTrail.push({x:player.x,y:player.y}); if(optTrail.length>120) optTrail.shift();
  updateOptions(dt);
  // thruster
  if(Math.random()<0.9) spawnParticles(player.x-player.r, player.y+rnd(-3,3), Math.random()<.5?'#57f6ff':'#8be9ff',1,60,0.25);
}
const optTrail=[];
function fire(){
  const mode=player.shotMode;
  if(mode==='laser'){ player.fireCd=0.16; shootLaser(player.x+player.r, player.y); Audio2.sfx.laser(); }
  else { player.fireCd=0.14;
    shootBullet(player.x+player.r, player.y, 620, 0);
    if(mode==='double'){ shootBullet(player.x+player.r*0.6, player.y-6, 520, -300); }
    Audio2.sfx.shoot(); }
  // options fire too
  for(const o of options){ if(mode==='laser') shootLaser(o.x+10,o.y); else { shootBullet(o.x+10,o.y,600,0); if(mode==='double') shootBullet(o.x+6,o.y-6,500,-300);} }
  // missiles
  if(player.hasMissile){ player.missileCd=(player.missileCd||0)-1; if((player.missileCd||0)<=0){ player.missileCd=9; dropMissile(player.x,player.y+8);
    for(const o of options) dropMissile(o.x,o.y+8); } }
}
function shootBullet(x,y,vx,vy){ bullets.push({x,y,vx,vy,r:5,dmg:1,color:'#ffd85e',kind:'bullet'}); }
function shootLaser(x,y){ bullets.push({x,y,vx:1150,vy:0,r:5,dmg:0.7,color:'#57f6ff',kind:'laser',pierce:true}); }
function dropMissile(x,y){ missiles.push({x,y,vx:360,vy:40,r:6}); Audio2.sfx.hit(); }

// options (子猫)
function addOption(){ if(options.length>=4) return false; options.push({x:player.x,y:player.y, delay:(options.length+1)*16}); return true; }
function updateOptions(dt){ for(const o of options){ const idx=Math.max(0, optTrail.length-1-o.delay); const p=optTrail[idx]; if(p){ o.x=p.x; o.y=p.y; } } }

function damagePlayer(){
  if(!player.alive||player.invuln>0) return;
  if(player.shield>0){ player.shield=0; player.invuln=1; Audio2.sfx.power(); showToast('SHIELD BREAK','#57f6ff'); spawnParticles(player.x,player.y,'#57f6ff',16,220,0.5); shake(6,.2); flash('#57f6ff',.3); return; }
  Audio2.sfx.hurt(); shake(14,.4); flash('#ff2e6e',.45); spawnParticles(player.x,player.y,'#57f6ff',36,300,1); spawnParticles(player.x,player.y,'#ff5ec9',26,240,1.1);
  player.alive=false; setTimeout(gameOver,900);
}

// ================= ENEMIES =================
function spawnEnemy(type, y, opt){ opt=opt||{}; const x=W+40;
  let e={x, y:y??rnd(50,H-50), t:type, hitFlash:0, seed:Math.random()*TAU, fireCd:rnd(0.8,1.8)};
  switch(type){
    case 'fan': Object.assign(e,{hp:2,r:15,vx:-170,vy:0,score:100,color:'#ff8a5e',amp:rnd(60,120),baseY:e.y}); break;
    case 'straight': Object.assign(e,{hp:2,r:14,vx:-210,vy:0,score:100,color:'#ffe15e'}); break;
    case 'wave': Object.assign(e,{hp:3,r:15,vx:-150,vy:0,score:150,color:'#b45eff',amp:rnd(50,110),baseY:e.y}); break;
    case 'gun': Object.assign(e,{hp:4,r:17,vx:-90,vy:0,score:250,color:'#5ec9ff',shoots:true,aim:true}); break;
    case 'turret': Object.assign(e,{hp:6,r:20,vx:-70,vy:0,score:300,color:'#5effa0',shoots:true,aim:true}); break;
    case 'gold': Object.assign(e,{hp:3,r:15,vx:-190,vy:0,score:200,color:'#ffd85e',amp:rnd(40,90),baseY:e.y,drop:true}); break; // 倒すとカプセル
  }
  e.maxhp=e.hp; if(opt.vx)e.vx=opt.vx; enemies.push(e); return e;
}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){ const e=enemies[i]; e.hitFlash=Math.max(0,e.hitFlash-dt*6);
    if(e.t==='boss'){ updateBoss(e,dt); continue; }
    e.x+=e.vx*dt;
    if(e.t==='fan'||e.t==='wave'||e.t==='gold') e.y=e.baseY+Math.sin(e.x*0.012+e.seed)*e.amp;
    if(e.shoots){ e.fireCd-=dt; if(e.fireCd<=0 && e.x<W-20 && e.x>W*0.3){ e.fireCd=rnd(1.3,2.4); enemyShoot(e); } }
    if(e.x<-50){ enemies.splice(i,1); }
  }
}
function enemyShoot(e){ if(e.aim && player.alive){ const a=Math.atan2(player.y-e.y,player.x-e.x); const sp=230;
    eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:6,color:'#ff5e8a'}); }
  else eBullets.push({x:e.x,y:e.y,vx:-240,vy:0,r:6,color:e.color}); Audio2.sfx.hit(); }

function drawEnemy(e){ ctx.save(); ctx.translate(e.x,e.y); if(e.t==='boss'){ drawBoss(e); ctx.restore(); return; }
  const flash=e.hitFlash>0, col=flash?'#fff':e.color; ctx.shadowColor=e.color; ctx.shadowBlur=12; ctx.fillStyle=col;
  switch(e.t){
    case 'fan': case 'gold': { ctx.beginPath(); ctx.moveTo(-e.r,0); ctx.lineTo(e.r*0.7,-e.r*0.8); ctx.lineTo(e.r,0); ctx.lineTo(e.r*0.7,e.r*0.8); ctx.closePath(); ctx.fill();
      ctx.fillStyle=flash?'#fff':'#301500'; ctx.beginPath(); ctx.arc(0,0,e.r*0.3,0,TAU); ctx.fill(); break; }
    case 'straight': { ctx.beginPath(); ctx.ellipse(0,0,e.r,e.r*0.75,0,0,TAU); ctx.fill(); ctx.fillStyle=flash?'#fff':'#3a3200';
      ctx.beginPath(); ctx.arc(-e.r*0.3,0,2.6,0,TAU); ctx.fill(); break; }
    case 'wave': { ctx.beginPath(); ctx.arc(0,0,e.r,0.2,TAU-0.2); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle=flash?'#fff':'#1a0033'; ctx.beginPath(); ctx.arc(2,-2,3,0,TAU); ctx.fill(); break; }
    case 'gun': { ctx.beginPath(); ctx.arc(0,0,e.r,0,TAU); ctx.fill(); ctx.fillStyle=flash?'#fff':'#022033'; ctx.beginPath(); ctx.arc(0,0,e.r*0.55,0,TAU); ctx.fill();
      const a=player.alive?Math.atan2(player.y-e.y,player.x-e.x):Math.PI; ctx.fillStyle=col; ctx.fillRect(0,-3,Math.cos(a)*e.r-2,6); break; }
    case 'turret': { ctx.beginPath(); for(let k=0;k<6;k++){ const a=k/6*TAU; ctx[k?'lineTo':'moveTo'](Math.cos(a)*e.r,Math.sin(a)*e.r);} ctx.closePath(); ctx.fill();
      ctx.fillStyle=flash?'#fff':'#053a1f'; ctx.beginPath(); ctx.arc(0,0,e.r*0.4,0,TAU); ctx.fill(); break; }
  }
  if(e.drop){ ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='900 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🐾',0,1); }
  if(e.maxhp>=4 && e.hp<e.maxhp){ ctx.shadowBlur=0; ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(-e.r,-e.r-8,e.r*2,4); ctx.fillStyle='#5effa0'; ctx.fillRect(-e.r,-e.r-8,e.r*2*(e.hp/e.maxhp),4); }
  ctx.restore();
}
function hitEnemy(e,dmg,x,y){ e.hp-=dmg; e.hitFlash=1; spawnParticles(x,y,e.color,3,120,0.3); if(e.hp<=0){ killEnemy(e); return true; } Audio2.sfx.hit(); return false; }
function killEnemy(e){ const i=enemies.indexOf(e); if(i>=0) enemies.splice(i,1); if(e.t==='boss'){ defeatBoss(e); return; }
  Audio2.sfx.explode(); spawnParticles(e.x,e.y,e.color,16,220,0.7); spawnParticles(e.x,e.y,'#fff',5,120,0.4); shake(2,.1);
  addScore(e.score); if(e.drop) spawnPowerup(e.x,e.y); }

// ================= POWERUPS (capsule) =================
function spawnPowerup(x,y){ powerups.push({x,y,vx:-120,vy:0,r:12,seed:Math.random()*TAU}); }
function updatePowerups(dt){ for(let i=powerups.length-1;i>=0;i--){ const p=powerups[i]; p.seed+=dt*4; p.x+=p.vx*dt;
  if(p.x<-30){ powerups.splice(i,1); continue; }
  if(player.alive && dist2(p.x,p.y,player.x,player.y)<(p.r+player.r)*(p.r+player.r)){ powerCursor=(powerCursor%6)+1; Audio2.sfx.coin(); spawnParticles(p.x,p.y,'#ffd85e',8,140,0.4); powerups.splice(i,1); refreshPowHint(); } } }
function drawPowerups(){ for(const p of powerups){ const bob=Math.sin(p.seed)*2; ctx.save(); ctx.translate(p.x,p.y+bob);
  ctx.shadowColor='#ffd85e'; ctx.shadowBlur=14; ctx.fillStyle='rgba(10,8,2,.85)'; ctx.strokeStyle='#ffd85e'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,0,p.r,0,TAU); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; ctx.font='14px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#ffd85e'; ctx.fillText('🐾',0,1); ctx.restore(); } }

function activatePower(){
  if(state!=='play'||!player.alive||powerCursor===0) return;
  const slot=POWERS[powerCursor-1];
  if(slot==='SPEED'){ if(player.speedLvl<5){ player.speedLvl++; spawnText(player.x,player.y-24,'SPEED '+player.speedLvl,'#57f6ff',15);} else { addScore(500); } }
  else if(slot==='MISSILE'){ player.hasMissile=true; spawnText(player.x,player.y-24,'MISSILE','#ff8a5e',15); }
  else if(slot==='DOUBLE'){ player.shotMode=(player.shotMode==='double'?'single':'double'); spawnText(player.x,player.y-24,'DOUBLE','#ffd85e',15); }
  else if(slot==='LASER'){ player.shotMode=(player.shotMode==='laser'?'single':'laser'); spawnText(player.x,player.y-24,'LASER','#57f6ff',15); }
  else if(slot==='OPTION'){ if(addOption()) spawnText(player.x,player.y-24,'OPTION x'+options.length,'#ffd0ee',15); else addScore(500); }
  else if(slot==='SHIELD'){ player.shield=12; spawnText(player.x,player.y-24,'SHIELD','#57f6ff',15); }
  Audio2.sfx.up(); powerCursor=0; refreshPowHint();
}

// ================= BULLETS / COLLISIONS =================
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x>W+30||b.x<-30||b.y<-30||b.y>H+30){ bullets.splice(i,1); continue; }
    let hit=false;
    for(let j=0;j<enemies.length;j++){ const e=enemies[j]; const rr=b.r+e.r; if(dist2(b.x,b.y,e.x,e.y)<rr*rr){
      hitEnemy(e,b.dmg,b.x,b.y); if(!b.pierce){ bullets.splice(i,1); hit=true; } break; } }
    if(hit) continue;
  }
  // missiles hug the bottom-ish, arc
  for(let i=missiles.length-1;i>=0;i--){ const m=missiles[i]; m.x+=m.vx*dt; m.y+=m.vy*dt; if(m.y<H-40) m.vy+=260*dt; else { m.y=H-40; m.vy=0; m.vx=420; }
    if(Math.random()<0.6) spawnParticles(m.x-4,m.y,'#ff8a3c',1,50,0.2);
    if(m.x>W+30){ missiles.splice(i,1); continue; }
    for(let j=0;j<enemies.length;j++){ const e=enemies[j]; const rr=m.r+e.r; if(dist2(m.x,m.y,e.x,e.y)<rr*rr){ spawnParticles(m.x,m.y,'#ff8a3c',10,180,0.5); hitEnemy(e,2,m.x,m.y); missiles.splice(i,1); break; } }
  }
}
function updateEBullets(dt){ for(let i=eBullets.length-1;i>=0;i--){ const b=eBullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){ eBullets.splice(i,1); continue; }
  if(player.alive&&player.invuln<=0){ const rr=b.r+player.r*0.7; if(dist2(b.x,b.y,player.x,player.y)<rr*rr){ eBullets.splice(i,1); damagePlayer(); } } }
  // enemy body collision
  if(player.alive&&player.invuln<=0){ for(const e of enemies){ const rr=e.r+player.r*0.7; if(dist2(e.x,e.y,player.x,player.y)<rr*rr){ damagePlayer(); break; } } }
}
function drawBullets(){ ctx.globalCompositeOperation='lighter';
  for(const b of bullets){ ctx.fillStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=8; ctx.beginPath();
    if(b.kind==='laser') ctx.ellipse(b.x,b.y,14,2.6,0,0,TAU); else ctx.ellipse(b.x,b.y,b.r*1.4,b.r*0.7,0,0,TAU); ctx.fill(); }
  for(const m of missiles){ ctx.fillStyle='#ff8a3c'; ctx.shadowColor='#ff8a3c'; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill(); }
  ctx.shadowBlur=0; ctx.globalCompositeOperation='source-over';
  for(const b of eBullets){ ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=b.color; ctx.shadowBlur=10; ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(0,0,b.r,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(-b.r*0.3,-b.r*0.3,b.r*0.4,0,TAU); ctx.fill(); ctx.restore(); } ctx.shadowBlur=0; }

// ================= OPTIONS / PLAYER DRAW =================
function drawCatShip(x,y,r,skinGlow){
  ctx.save(); ctx.translate(x,y);
  // thruster
  const tl=8+player.thrust*16+Math.random()*6; ctx.globalCompositeOperation='lighter';
  const fg=ctx.createLinearGradient(-r,0,-r-tl,0); fg.addColorStop(0,'#aefcff'); fg.addColorStop(.5,'#57f6ff'); fg.addColorStop(1,'rgba(255,94,201,0)');
  ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(-r+2,-6); ctx.lineTo(-r+2,6); ctx.lineTo(-r-tl,0); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  // body (facing right)
  ctx.shadowColor='#57f6ff'; ctx.shadowBlur=14; const g=ctx.createLinearGradient(0,-r,0,r); g.addColorStop(0,'#fff'); g.addColorStop(.5,'#8be9ff'); g.addColorStop(1,'#2b7bd6');
  ctx.fillStyle=g; ctx.strokeStyle='#eaf6ff'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(r+2,0); ctx.quadraticCurveTo(r*0.4,r*1.1,-r*0.9,r*0.6); ctx.quadraticCurveTo(-r*0.5,0,-r*0.9,-r*0.6); ctx.quadraticCurveTo(r*0.4,-r*1.1,r+2,0); ctx.fill(); ctx.stroke();
  // ears (top)
  ctx.fillStyle='#8be9ff'; ctx.beginPath(); ctx.moveTo(-r*0.2,-r*0.55); ctx.lineTo(-r*0.7,-r*0.95); ctx.lineTo(0,-r*0.5); ctx.closePath();
  ctx.moveTo(r*0.25,-r*0.5); ctx.lineTo(r*0.1,-r*0.95); ctx.lineTo(r*0.5,-r*0.45); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  // face
  ctx.fillStyle='#0a1230'; ctx.beginPath(); ctx.ellipse(r*0.15,0,r*0.5,r*0.5,0,0,TAU); ctx.fill();
  ctx.fillStyle='#57f6ff'; ctx.beginPath(); ctx.arc(r*0.25,-3,2.2,0,TAU); ctx.arc(r*0.25,3,2.2,0,TAU); ctx.fill();
  ctx.fillStyle='#ff5ec9'; ctx.beginPath(); ctx.arc(r*0.5,0,2,0,TAU); ctx.fill();
  ctx.restore();
}
function drawPlayer(){ if(!player.alive) return; const blink=player.invuln>0&&Math.floor(player.invuln*16)%2===0;
  if(player.shield>0){ ctx.save(); ctx.translate(player.x,player.y); ctx.strokeStyle=`rgba(87,246,255,${0.4+0.3*Math.sin(performance.now()*0.01)})`; ctx.lineWidth=3; ctx.shadowColor='#57f6ff'; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(6,0,player.r+11,-1.1,1.1); ctx.stroke(); ctx.restore(); ctx.shadowBlur=0; }
  ctx.globalAlpha=blink?0.4:1; drawCatShip(player.x,player.y,player.r); ctx.globalAlpha=1;
}
function drawOptions(){ for(const o of options){ ctx.save(); ctx.translate(o.x,o.y); const r=8; ctx.shadowColor='#ffd0ee'; ctx.shadowBlur=8;
  ctx.fillStyle='#fff6fb'; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-r*0.5,-r*0.5); ctx.lineTo(-r*0.9,-r*1.05); ctx.lineTo(-r*0.1,-r*0.6); ctx.closePath(); ctx.moveTo(r*0.5,-r*0.5); ctx.lineTo(r*0.9,-r*1.05); ctx.lineTo(r*0.1,-r*0.6); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#57c9ff'; ctx.beginPath(); ctx.arc(-2.4,0,1.4,0,TAU); ctx.arc(2.4,0,1.4,0,TAU); ctx.fill(); ctx.restore(); } }

// ================= BOSS =================
let boss=null, bossActive=false;
function spawnBoss(){ Audio2.sfx.warn(); showToast('⚠ WARNING ⚠','#ff5ec9');
  const hp=600+stage*180; boss={t:'boss',x:W+160,y:H/2,tx:W-170,r:70,hp,maxhp:hp,phase:0,phaseTimer:0,fireCd:1.4,hitFlash:0,angle:0,entered:false,sweepDir:1};
  enemies.push(boss); }
function updateBoss(e,dt){ e.angle+=dt*1.4; e.hitFlash=Math.max(0,e.hitFlash-dt*6);
  if(!e.entered){ e.x+=(e.tx-e.x)*Math.min(1,dt*1.6); if(Math.abs(e.x-e.tx)<4)e.entered=true; return; }
  e.phaseTimer+=dt; e.y+=e.sweepDir*70*dt; if(e.y<110){e.y=110;e.sweepDir=1;} if(e.y>H-110){e.y=H-110;e.sweepDir=-1;}
  e.fireCd-=dt; const frac=e.hp/e.maxhp;
  if(e.fireCd<=0){ if(frac>0.5){ e.fireCd=0.8; const a=Math.atan2(player.y-e.y,player.x-e.x); for(let k=-1;k<=1;k++){ const aa=a+k*0.22; eBullets.push({x:e.x-e.r,y:e.y,vx:Math.cos(aa)*260,vy:Math.sin(aa)*260,r:7,color:'#ff5ec9'});} Audio2.sfx.hit(); }
    else { e.fireCd=1.2; const n=12; for(let k=0;k<n;k++){ const aa=k/n*TAU+e.angle; eBullets.push({x:e.x,y:e.y,vx:Math.cos(aa)*200,vy:Math.sin(aa)*200,r:6,color:'#ffd85e'});} Audio2.sfx.big(); } }
}
function drawBoss(e){ const flash=e.hitFlash>0, r=e.r; ctx.shadowColor='#ff5ec9'; ctx.shadowBlur=22;
  // 大きな猫コア(左向きに口)
  const grad=ctx.createLinearGradient(0,-r,0,r); grad.addColorStop(0,flash?'#fff':'#ff8ad6'); grad.addColorStop(1,flash?'#fff':'#7a1150'); ctx.fillStyle=grad;
  ctx.beginPath(); ctx.ellipse(0,0,r*0.9,r,0,0,TAU); ctx.fill();
  // ears
  ctx.beginPath(); ctx.moveTo(-r*0.3,-r*0.7); ctx.lineTo(-r*0.9,-r*1.15); ctx.lineTo(-r*0.1,-r*0.6); ctx.closePath();
  ctx.moveTo(r*0.3,-r*0.7); ctx.lineTo(r*0.9,-r*1.15); ctx.lineTo(r*0.1,-r*0.6); ctx.closePath(); ctx.fill();
  // eye (weak point glow) facing left
  ctx.shadowBlur=16; ctx.shadowColor='#57f6ff'; ctx.fillStyle=flash?'#fff':(e.hp/e.maxhp<0.5?'#ff3b3b':'#57f6ff');
  ctx.beginPath(); ctx.arc(-r*0.3,0,r*0.22,0,TAU); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#0a0010'; ctx.fillRect(-r*0.35,-r*0.18,3,r*0.36);
  // mouth (cannon)
  ctx.strokeStyle='#2a0016'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(-r*0.6,r*0.25,r*0.28,-0.6,0.6); ctx.stroke();
}
function defeatBoss(e){ boss=null; bossActive=false; Audio2.sfx.big();
  for(let k=0;k<8;k++) setTimeout(()=>{ spawnParticles(e.x+rnd(-40,40),e.y+rnd(-40,40),k%2?'#ff5ec9':'#57f6ff',20,300,.9); Audio2.sfx.explode(); shake(12,.3); },k*90);
  spawnParticles(e.x,e.y,'#ffd85e',40,340,1.1); shake(22,.6); flash('#fff',.5); addScore(4000+stage*600); showToast('★ STAGE CLEAR ★','#ffd85e');
  setTimeout(()=>startStage(stage+1),2200);
}

// ================= DIRECTOR =================
let stage=1, spawnTimer=0, distance=0, stageBanner=0, stageRemaining=0, bossPending=false, stagePool=[];
// How strong the player currently is (0 when fresh, grows with power-ups).
function playerPower(){ let p=player.speedLvl*0.4;
  if(player.shotMode==='double') p+=1.2; if(player.shotMode==='laser') p+=1.8;
  if(player.hasMissile) p+=1; p+=options.length*1.4; if(player.shield>0) p+=0.4; return p; }
// Blended difficulty: starts near 0 and ramps up with both stage and player power.
function diffLevel(){ return (stage-1)*1.1 + playerPower()*0.75; }
function startStage(n){ stage=n; bossActive=false; bossPending=false; stageBanner=2.2; Audio2.sfx.up(); showToast('STAGE '+n,'#57f6ff');
  stagePool=['fan','straight','wave']; if(n>=1) stagePool.push('gold'); if(n>=2) stagePool.push('gun','wave','gold'); if(n>=3) stagePool.push('turret','gun');
  stageRemaining=14+n*8;   // total enemies to release this stage
  spawnTimer=1.6; }        // grace period so a weak start isn't swarmed
function updateDirector(dt){ if(stageBanner>0) stageBanner-=dt; distance+=dt*(6+stage); if(bossActive) return;
  const d=diffLevel();
  const cap=Math.round(clamp(2+d*0.9, 2, 14));   // max enemies allowed on screen at once
  if(stageRemaining>0){ spawnTimer-=dt; if(spawnTimer<=0){
    if(enemies.length>=cap){ spawnTimer=0.3; return; }   // hold back until the screen thins out
    const gap=clamp(1.6-d*0.13, 0.45, 1.7)*rnd(0.8,1.2); // weak → slow trickle, strong → fast
    const type=pick(stagePool);
    const fchance=clamp(0.06+d*0.045, 0.06, 0.55);       // formations get more common as you power up
    if((type==='fan'||type==='straight'||type==='gold') && Math.random()<fchance){
      const fsize=Math.round(clamp(3+d*0.35, 3, 6)); const fy=rnd(80,H-80);
      for(let k=0;k<fsize;k++) setTimeout(()=>{ if(state==='play') spawnEnemy(type, clamp(fy+(k-(fsize-1)/2)*34,50,H-50)); }, k*150);
      stageRemaining-=fsize;
    } else { spawnEnemy(type); stageRemaining--; }
    spawnTimer=gap;
  } }
  else if(!bossPending){ bossPending=true; spawnTimer=1.8; }
  else { spawnTimer-=dt; if(spawnTimer<=0 && enemies.length<3){ bossActive=true; spawnBoss(); } }
}

// ================= SCORE / FX =================
let score=0, high=parseInt(localStorage.getItem('nekota_yoko_high')||'0',10)||0;
function addScore(n){ score+=n; }
let shakeMag=0,shakeTime=0,flashColor=null,flashA=0;
function shake(m,t){ shakeMag=Math.max(shakeMag,m); shakeTime=Math.max(shakeTime,t); }
function flash(c,a){ flashColor=c; flashA=Math.max(flashA,a); }

    ctx.fillStyle='#ff5ec9'; ctx.shadowColor='#ff5ec9'; ctx.shadowBlur=8; roundRect(x,y,w*clamp(boss.hp/boss.maxhp,0,1),h,4); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='900 10px "Trebuchet MS"'; ctx.textBaseline='top'; ctx.fillText('★ NYAN CORE ★',W/2,y-2); }
  if(stageBanner>0){ const a=Math.min(1, stageBanner>1.6?(2.2-stageBanner)/0.6:stageBanner/1.0); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 40px "Trebuchet MS"'; ctx.fillStyle='#fff'; ctx.shadowColor='#57f6ff'; ctx.shadowBlur=18; ctx.fillText('STAGE '+stage,W/2,H*0.4); ctx.globalAlpha=1; ctx.shadowBlur=0; }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

const toastEl=document.getElementById('toast');
function showToast(t,c){ toastEl.textContent=t; toastEl.style.color=c||'#57f6ff'; toastEl.style.transition='none'; toastEl.style.opacity='1'; toastEl.style.transform='translateX(-50%) scale(1.15)';
  requestAnimationFrame(()=>{ toastEl.style.transition='opacity 1.2s, transform 1.2s'; toastEl.style.opacity='0'; toastEl.style.transform='translateX(-50%) scale(1)'; }); }

// ================= INPUT =================
const keys={};
window.addEventListener('keydown',e=>{ if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault(); keys[e.key.toLowerCase()]=true;
  if(e.key==='p'||e.key==='P') togglePause(); if((e.key==='x'||e.key==='X')&&state==='play') activatePower(); if(e.key==='m'||e.key==='M') Audio2.toggle();
  Audio2.init(); Audio2.resume(); });
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')){ if(state==='title')startGame(); else if(state==='over')startGame(); }});

const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0; if(isTouch) document.body.classList.add('touch');
// drag move on canvas
function toWorld(cx,cy){ const r=cv.getBoundingClientRect(); const sx=cv.width/r.width, sy=cv.height/r.height;
  return { x:((cx-r.left)*sx-offX)/scaleX, y:((cy-r.top)*sy-offY)/scaleY }; }
let dragId=null;
cv.addEventListener('touchstart',e=>{ Audio2.init();Audio2.resume(); if(state!=='play')return; const t=e.changedTouches[0]; dragId=t.identifier; const w=toWorld(t.clientX,t.clientY); player.tx=w.x; player.ty=w.y; dragActive=true; e.preventDefault(); },{passive:false});
cv.addEventListener('touchmove',e=>{ if(state!=='play')return; for(const t of e.changedTouches){ if(t.identifier===dragId){ const w=toWorld(t.clientX,t.clientY); player.tx=w.x; player.ty=w.y; } } e.preventDefault(); },{passive:false});
cv.addEventListener('touchend',e=>{ for(const t of e.changedTouches){ if(t.identifier===dragId){ dragId=null; dragActive=false; } } },{passive:false});
let dragActive=false;

// dpad
const dpadEl=document.getElementById('dpad'), dnub=document.getElementById('dnub'); let dpadTouchId=null;
function dpadSet(cx,cy){ const r=dpadEl.getBoundingClientRect(); const vx=cx-(r.left+r.width/2), vy=cy-(r.top+r.height/2); const mag=Math.hypot(vx,vy);
  if(mag<6){ dpad.dx=0; dpad.dy=0; dnub.style.transform='translate(0,0)'; } else { dpad.dx=vx/mag; dpad.dy=vy/mag; const nm=Math.min(mag,r.width*0.32); dnub.style.transform=`translate(${dpad.dx*nm}px,${dpad.dy*nm}px)`; } dpad.active=true; }
function dpadEnd(){ dpad.active=false; dpad.dx=0; dpad.dy=0; dpadTouchId=null; dnub.style.transform='translate(0,0)'; }
dpadEl.addEventListener('touchstart',e=>{ Audio2.init();Audio2.resume(); const t=e.changedTouches[0]; dpadTouchId=t.identifier; dpadSet(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
dpadEl.addEventListener('touchmove',e=>{ for(const t of e.changedTouches){ if(t.identifier===dpadTouchId) dpadSet(t.clientX,t.clientY); } e.preventDefault(); },{passive:false});
dpadEl.addEventListener('touchend',e=>{ for(const t of e.changedTouches){ if(t.identifier===dpadTouchId) dpadEnd(); } e.preventDefault(); },{passive:false});
dpadEl.addEventListener('mousedown',e=>{ dpadTouchId='m'; dpadSet(e.clientX,e.clientY); e.preventDefault(); });
window.addEventListener('mousemove',e=>{ if(dpadTouchId==='m'&&(e.buttons&1)) dpadSet(e.clientX,e.clientY); });
window.addEventListener('mouseup',()=>{ if(dpadTouchId==='m') dpadEnd(); });

const powBtn=document.getElementById('powBtn'), powHint=document.getElementById('powHint');
function refreshPowHint(){ powHint.textContent = powerCursor? POWJP[powerCursor-1] : 'かいほう'; }
powBtn.addEventListener('touchstart',e=>{ e.preventDefault(); Audio2.init();Audio2.resume(); activatePower(); },{passive:false});
powBtn.addEventListener('mousedown',e=>{ e.preventDefault(); Audio2.init();Audio2.resume(); activatePower(); });

// ================= STATE =================
let state='title', last=performance.now();
const titleScreen=document.getElementById('titleScreen'), overScreen=document.getElementById('overScreen'), pauseScreen=document.getElementById('pauseScreen'), pauseBtn=document.getElementById('pauseBtn');
function showHigh(){ document.getElementById('titleHigh').textContent= high>0?'BEST  '+high.toLocaleString():''; }
showHigh();
function startGame(){ score=0; distance=0; stage=0; powerCursor=0;
  bullets.length=0; enemies.length=0; eBullets.length=0; particles.length=0; powerups.length=0; texts.length=0; options.length=0; missiles.length=0; optTrail.length=0;
  boss=null; bossActive=false; bossPending=false; stageRemaining=0; resetPlayer(); initStars(); dragActive=false; dpadEnd(); refreshPowHint();
  titleScreen.classList.add('hidden'); overScreen.classList.add('hidden'); pauseScreen.classList.add('hidden'); pauseBtn.style.display='flex';
  state='play'; Audio2.init(); Audio2.resume(); Audio2.startMusic(); startStage(1); }
function gameOver(){ state='over'; Audio2.stopMusic(); pauseBtn.style.display='none';
  if(score>high){ high=score; localStorage.setItem('nekota_yoko_high',String(high)); }
  document.getElementById('finalScore').textContent=score.toLocaleString(); document.getElementById('finalDist').textContent=Math.floor(distance)+'m';
  document.getElementById('overHigh').textContent='BEST  '+high.toLocaleString(); document.getElementById('goTitle').textContent= stage>=3?'GREAT RUN!':'GAME OVER';
  overScreen.classList.remove('hidden'); showHigh(); }
function togglePause(){ if(state==='play'){ state='pause'; pauseScreen.classList.remove('hidden'); Audio2.stopMusic(); } else if(state==='pause'){ state='play'; pauseScreen.classList.add('hidden'); Audio2.startMusic(); last=performance.now(); } }
document.getElementById('startBtn').addEventListener('click',()=>{ Audio2.init();Audio2.resume(); Audio2.sfx.select(); startGame(); });
document.getElementById('retryBtn').addEventListener('click',()=>{ Audio2.sfx.select(); startGame(); });
document.getElementById('resumeBtn').addEventListener('click',togglePause);
document.getElementById('quitBtn').addEventListener('click',()=>{ state='title'; pauseScreen.classList.add('hidden'); pauseBtn.style.display='none'; titleScreen.classList.remove('hidden'); Audio2.stopMusic(); showHigh(); });
pauseBtn.addEventListener('click',togglePause);
overScreen.addEventListener('touchstart',e=>{ e.preventDefault(); startGame(); },{passive:false});
// sound btn
const soundBtn=document.getElementById('soundBtn'); let muted=false;
soundBtn.addEventListener('click',()=>{ Audio2.init();Audio2.resume(); muted=!muted; Audio2.setMuted(muted); soundBtn.textContent=muted?'🔇':'🔊'; if(!muted&&state==='play')Audio2.startMusic(); else if(muted)Audio2.stopMusic(); });

// ================= LOOP =================
function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; requestAnimationFrame(loop);
  updateStars(dt); updateParticles(dt); updateTexts(dt);
  if(state==='play'){
    // drag → set player toward target
    if(dragActive && player.tx!==undefined){ const ddx=player.tx-player.x, ddy=player.ty-player.y; const d=Math.hypot(ddx,ddy); if(d>1){ const mv=Math.min(d,520*dt); player.x+=ddx/d*mv; player.y+=ddy/d*mv; } player.thrust=1; }
    updatePlayer(dt); updateDirector(dt); updateEnemies(dt); updateBullets(dt); updateEBullets(dt); updatePowerups(dt);
  }
  if(shakeTime>0){ shakeTime-=dt; if(shakeTime<=0)shakeMag=0; }
  if(flashA>0) flashA=Math.max(0,flashA-dt*2);
  // render
  ctx.setTransform(scaleX,0,0,scaleY,offX,offY); ctx.clearRect(-offX/scaleX,-offY/scaleY,cv.width/scaleX,cv.height/scaleY);
  // bg
  ctx.fillStyle='#05060f'; ctx.fillRect(0,0,W,H);
  let ox=0,oy=0; if(shakeMag>0){ ox=rnd(-shakeMag,shakeMag); oy=rnd(-shakeMag,shakeMag); ctx.translate(ox,oy); }
  drawTerrain(); drawStars(); drawPowerups(); drawParticles(); drawBullets();
  for(const e of enemies) drawEnemy(e); drawOptions(); drawPlayer(); drawTexts();
  if(shakeMag>0) ctx.translate(-ox,-oy);
  if(state==='play'||state==='pause') drawHUD();
  if(flashA>0){ ctx.fillStyle=flashColor; ctx.globalAlpha=flashA*0.5; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  // vignette
  const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,W*0.6); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.5)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
// drag target fields
player.tx=undefined; player.ty=undefined;
resize(); initStars(); requestAnimationFrame(loop);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
})();
</script>
