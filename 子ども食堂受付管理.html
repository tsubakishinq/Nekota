<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="食堂受付">
<title>子ども食堂 受付管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#f5f2ee;--surface:#fff;--ink:#1a1714;--ink-light:#6b6560;--accent:#e08a2e;--accent-light:#fdf1e2;--border:#e2ddd8;--success:#27ae60;--blue:#2980b9;--blue-light:#ebf5fb;--closed:#b0a99f;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 0 60px;}
  header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  header h1{font-size:15px;font-weight:700;letter-spacing:.02em;}
  header .today{font-family:'DM Mono',monospace;font-size:12px;color:#aaa;}
  main{max-width:560px;margin:0 auto;padding:16px;}

  .back-btn{display:inline-flex;align-items:center;gap:2px;background:none;border:none;color:var(--accent);font-size:13px;font-weight:700;padding:8px 0;margin-bottom:8px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
  .screen-header{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .screen-loc-name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px;}
  .screen-loc-sub{font-size:12px;color:var(--ink-light);}

  .input-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin-bottom:16px;}
  .input-card h2{font-size:12px;font-weight:500;color:var(--ink-light);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
  .field-row{display:flex;gap:10px;margin-bottom:12px;}
  .field{flex:1;}
  .field label{display:block;font-size:11px;color:var(--ink-light);margin-bottom:6px;letter-spacing:.03em;}
  .field input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:11px 12px;font-size:15px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--bg);outline:none;transition:border-color .2s;}
  .field input:focus{border-color:var(--accent);background:#fff;}
  .field input[type="number"]{font-family:'DM Mono',monospace;}
  .btn-row{display:flex;gap:10px;}
  .btn-primary{flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;letter-spacing:.03em;}
  .line-btn{display:block;width:100%;box-sizing:border-box;text-align:center;background:#06c755;color:#fff;border:none;border-radius:10px;padding:14px;font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:700;text-decoration:none;margin-bottom:10px;}
  .btn-cancel{flex:0 0 auto;background:var(--bg);color:var(--ink-light);border:1.5px solid var(--border);border-radius:10px;padding:14px 18px;font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:500;cursor:pointer;}

  .record-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .record-item{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);gap:12px;}
  .record-item:last-child{border-bottom:none;}
  .record-name{font-size:14px;color:var(--ink);flex:1;font-weight:500;}
  .record-people{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:var(--accent);text-align:right;}
  .record-actions{display:flex;gap:6px;}
  .icon-btn{border:none;background:none;color:var(--ink-light);font-size:15px;cursor:pointer;padding:4px 6px;line-height:1;}
  .icon-btn:active{opacity:.5;}
  .icon-btn.del{color:var(--accent);}

  .empty-state{padding:32px 16px;text-align:center;color:var(--ink-light);font-size:13px;}

  .admin-link-wrap{text-align:center;margin-top:28px;}
  .admin-link{background:none;border:none;color:var(--ink-light);font-size:11px;padding:10px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-decoration:underline;text-decoration-color:var(--border);}
  .admin-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:16px;}

  .complete-icon{font-size:40px;text-align:center;margin-bottom:8px;}
  .complete-title{font-size:17px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:20px;}
  .complete-number-label{font-size:11px;color:var(--ink-light);text-align:center;letter-spacing:.08em;text-transform:uppercase;}
  .complete-number{font-family:'DM Mono',monospace;font-size:40px;font-weight:700;color:var(--accent);text-align:center;letter-spacing:.05em;margin:4px 0 10px;}
  .complete-screenshot-note{font-size:13px;font-weight:700;color:var(--accent);text-align:center;margin-bottom:8px;}
  .complete-number-note{font-size:11px;color:var(--ink-light);text-align:center;margin-bottom:20px;line-height:1.6;}
  .complete-table{background:var(--bg);border-radius:10px;padding:4px 16px;margin-bottom:20px;}

  .lookup-entry-btn{display:block;width:100%;box-sizing:border-box;text-align:center;background:var(--accent-light);color:var(--accent);border:1.5px solid var(--accent);border-radius:12px;padding:14px;font-size:13px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-bottom:20px;}
  .lookup-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;}
  .lookup-card h2{font-size:12px;font-weight:500;color:var(--ink-light);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
  .lookup-row{display:flex;gap:8px;}
  .lookup-row input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:11px 12px;font-size:15px;font-family:'DM Mono',monospace;color:var(--ink);background:var(--bg);outline:none;}
  .lookup-row input:focus{border-color:var(--accent);background:#fff;}
  .lookup-row button{flex:0 0 auto;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 18px;font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;}
  .lookup-result{margin-top:14px;background:var(--bg);border-radius:10px;padding:4px 16px;}
  .lookup-result.error{color:var(--accent);text-align:center;padding:14px 0;background:none;}
  .complete-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;gap:12px;}
  .complete-row:last-child{border-bottom:none;}
  .complete-row .c-label{color:var(--ink-light);flex:0 0 auto;}
  .complete-row .c-value{color:var(--ink);font-weight:700;text-align:right;}
</style>
</head>
<body>
<header>
  <h1>🍚 子ども食堂 受付管理</h1>
  <span class="today" id="headerDate"></span>
</header>

<main>
  <div id="screenEvent">
    <div class="input-card" style="text-align:center">
      <div class="complete-title">9/15（火）17時〜</div>
      <button type="button" class="btn-primary" style="width:100%" onclick="showRsvpForm()">参加する</button>
    </div>

    <button type="button" class="lookup-entry-btn" onclick="showLookup()">📋 参加登録の確認（登録番号をお持ちの方はこちら）</button>

    <div class="admin-link-wrap">
      <button type="button" class="admin-link" onclick="showAdmin()">管理画面</button>
    </div>
  </div>

  <div id="screenRsvpForm" style="display:none">
    <button type="button" class="back-btn" onclick="returnFromRsvpForm()">‹ 戻る</button>
    <div class="screen-header">
      <div class="screen-loc-name">9/15（火）17時〜</div>
    </div>
    <div class="input-card">
      <h2 id="formTitle">参加登録</h2>
      <div class="field-row">
        <div class="field">
          <label>お名前</label>
          <input type="text" id="fName" placeholder="例：山田 太郎">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>大人の人数</label>
          <input type="number" id="fAdults" min="0" value="1" inputmode="numeric">
        </div>
        <div class="field">
          <label>子供の人数</label>
          <input type="number" id="fChildren" min="0" value="0" inputmode="numeric">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="submitBtn" onclick="submitRsvp()">登録する</button>
        <button class="btn-cancel" onclick="returnFromRsvpForm()">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="screenLookup" style="display:none">
    <button type="button" class="back-btn" onclick="hideLookup()">‹ 戻る</button>
    <div class="admin-title">参加登録の確認</div>
    <div class="lookup-card">
      <h2>登録番号を入力してください</h2>
      <div class="lookup-row">
        <input type="text" id="lookupNumber" placeholder="例：0001" inputmode="numeric" maxlength="4">
        <button type="button" onclick="lookupRsvp()">確認する</button>
      </div>
      <div id="lookupResult"></div>
    </div>
  </div>

  <div id="screenAdmin" style="display:none">
    <button type="button" class="back-btn" onclick="hideAdmin()">‹ 受付画面に戻る</button>
    <div class="admin-title">管理画面：参加者一覧</div>
    <div class="input-card">
      <div class="complete-row"><span class="c-label">合計人数</span><span class="c-value" id="summaryTotal">0人</span></div>
      <div class="complete-row"><span class="c-label">大人</span><span class="c-value" id="summaryAdults">0人</span></div>
      <div class="complete-row"><span class="c-label">子供</span><span class="c-value" id="summaryChildren">0人</span></div>
    </div>
    <div id="entryListWrap"></div>
  </div>

  <div id="screenComplete" style="display:none">
    <div class="input-card">
      <div class="complete-icon">✅</div>
      <div class="complete-title">参加登録が完了しました</div>
      <div class="complete-number-label">登録番号</div>
      <div class="complete-number" id="completeNumber"></div>
      <div class="complete-screenshot-note">📷 スクショして保存してください</div>
      <div class="complete-number-note">この番号を控えておくと、後で「参加登録の確認」から内容を確認できます</div>
      <div class="complete-table">
        <div class="complete-row"><span class="c-label">日時</span><span class="c-value">9/15（火）17時〜</span></div>
        <div class="complete-row"><span class="c-label">お名前</span><span class="c-value" id="completeName"></span></div>
        <div class="complete-row"><span class="c-label">大人</span><span class="c-value" id="completeAdults"></span></div>
        <div class="complete-row"><span class="c-label">子供</span><span class="c-value" id="completeChildren"></span></div>
      </div>
      <a href="https://lin.ee/uaNDeqg" target="_blank" rel="noopener" class="line-btn">🟢 LINEで友だち追加</a>
      <button type="button" class="btn-primary" onclick="backToHomeFromComplete()">戻る</button>
    </div>
  </div>
</main>

<script>
const EVENT_LABEL = '9/15（火）17時〜';
const ADMIN_PIN = '0945';

const SUPABASE_URL = 'https://terzisgstbqeiqrtiblj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_boiIMnJ4Qy-DUh4dsiN5Jg_Ji9tJHoJ';
const SYNC_INTERVAL_MS = 8000;
const WEB3FORMS_ACCESS_KEY = '4a3c879b-aa6a-4a41-80b4-12124fa0f2c8';

async function notifyByEmail(number, name, adults, children){
  try{
    await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: `子ども食堂 参加登録 #${number}: ${name}`,
        登録番号: number,
        日時: EVENT_LABEL,
        お名前: name,
        大人の人数: `${adults}人`,
        子供の人数: `${children}人`
      })
    });
  }catch(e){ /* 通知メールの失敗は登録処理自体には影響させない */ }
}

let rsvps = [];
let formMode = false;
let editingId = null;
let adminMode = false;
let cameFromAdmin = false;
let showComplete = false;
let lookupMode = false;
let lastSubmission = null;

async function apiFetch(path, options={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      ...(options.headers||{})
    }
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`API error ${res.status}: ${text}`);
  }
  return res;
}

async function refreshData(){
  const res = await apiFetch('rsvps?select=*&order=id.asc');
  rsvps = await res.json();
}

function padNum(n){
  return String(n).padStart(4,'0');
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderHeader(){
  const now = new Date();
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
}

function currentScreen(){
  if(adminMode) return 'admin';
  if(showComplete) return 'complete';
  if(lookupMode) return 'lookup';
  if(formMode) return 'form';
  return 'event';
}

function renderScreens(){
  const screen = currentScreen();
  document.getElementById('screenEvent').style.display = screen==='event' ? 'block' : 'none';
  document.getElementById('screenRsvpForm').style.display = screen==='form' ? 'block' : 'none';
  document.getElementById('screenAdmin').style.display = screen==='admin' ? 'block' : 'none';
  document.getElementById('screenComplete').style.display = screen==='complete' ? 'block' : 'none';
  document.getElementById('screenLookup').style.display = screen==='lookup' ? 'block' : 'none';
}

function showRsvpForm(){
  formMode = true;
  editingId = null;
  document.getElementById('fName').value = '';
  document.getElementById('fAdults').value = 1;
  document.getElementById('fChildren').value = 0;
  document.getElementById('formTitle').textContent = '参加登録';
  document.getElementById('submitBtn').textContent = '登録する';
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('fName').focus();
}

function returnFromRsvpForm(){
  formMode = false;
  editingId = null;
  if(cameFromAdmin){
    adminMode = true;
    cameFromAdmin = false;
  }
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showLookup(){
  lookupMode = true;
  document.getElementById('lookupNumber').value = '';
  document.getElementById('lookupResult').innerHTML = '';
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function hideLookup(){
  lookupMode = false;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function findRsvpByNumber(numStr){
  const id = Number(String(numStr).trim().replace(/^0+(?=\d)/, ''));
  if(!id) return null;
  return rsvps.find(e => Number(e.id) === id) || null;
}

function lookupRsvp(){
  const input = document.getElementById('lookupNumber').value;
  const result = document.getElementById('lookupResult');
  const found = findRsvpByNumber(input);
  if(!found){
    result.className = 'lookup-result error';
    result.textContent = '登録が見つかりませんでした。番号をご確認ください。';
    return;
  }
  result.className = 'lookup-result';
  result.innerHTML = `
    <div class="complete-row"><span class="c-label">日時</span><span class="c-value">${EVENT_LABEL}</span></div>
    <div class="complete-row"><span class="c-label">お名前</span><span class="c-value">${escapeHtml(found.name)}</span></div>
    <div class="complete-row"><span class="c-label">大人</span><span class="c-value">${found.adults}人</span></div>
    <div class="complete-row"><span class="c-label">子供</span><span class="c-value">${found.children}人</span></div>
  `;
}

function renderComplete(){
  if(!lastSubmission) return;
  document.getElementById('completeNumber').textContent = lastSubmission.number;
  document.getElementById('completeName').textContent = lastSubmission.name;
  document.getElementById('completeAdults').textContent = `${lastSubmission.adults}人`;
  document.getElementById('completeChildren').textContent = `${lastSubmission.children}人`;
}

function backToHomeFromComplete(){
  showComplete = false;
  lastSubmission = null;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showAdmin(){
  const input = window.prompt('管理画面のPIN（4桁）を入力してください');
  if(input === null) return;
  if(input !== ADMIN_PIN){
    alert('PINが違います');
    return;
  }
  adminMode = true;
  cameFromAdmin = false;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function hideAdmin(){
  adminMode = false;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderEntryList(){
  const wrap = document.getElementById('entryListWrap');
  if(rsvps.length===0){
    wrap.innerHTML = '<div class="empty-state">まだ参加登録がありません</div>';
    return;
  }
  const rows = rsvps.map(e=>`
    <div class="record-item">
      <span class="record-name">${escapeHtml(e.name)}</span>
      <span class="record-people">大人${e.adults}・子供${e.children}</span>
      <span class="record-actions">
        <button class="icon-btn" onclick="startEditRsvp('${e.id}')">✏️</button>
        <button class="icon-btn del" onclick="deleteRsvp('${e.id}')">🗑</button>
      </span>
    </div>
  `).join('');
  wrap.innerHTML = `<div class="record-list">${rows}</div>`;
}

function renderAdminSummary(){
  const totalAdults = rsvps.reduce((s,e)=>s+Number(e.adults||0),0);
  const totalChildren = rsvps.reduce((s,e)=>s+Number(e.children||0),0);
  document.getElementById('summaryAdults').textContent = `${totalAdults}人`;
  document.getElementById('summaryChildren').textContent = `${totalChildren}人`;
  document.getElementById('summaryTotal').textContent = `${totalAdults+totalChildren}人`;
}

function renderAll(){
  renderEntryList();
  renderAdminSummary();
  renderComplete();
  renderScreens();
}

async function submitRsvp(){
  const name = document.getElementById('fName').value.trim();
  const adults = Number(document.getElementById('fAdults').value) || 0;
  const children = Number(document.getElementById('fChildren').value) || 0;

  if(!name){
    alert('お名前を入力してください');
    return;
  }
  if(adults + children <= 0){
    alert('人数を入力してください');
    return;
  }

  const isEdit = !!editingId;
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  let insertedId = null;
  try{
    if(isEdit){
      await apiFetch(`rsvps?id=eq.${editingId}`, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ name, adults, children })
      });
    }else{
      const res = await apiFetch('rsvps', {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify({ name, adults, children })
      });
      const [row] = await res.json();
      insertedId = row.id;
    }
    await refreshData();
  }catch(e){
    alert('通信エラーで保存できませんでした。電波状況を確認してもう一度お試しください。');
    submitBtn.disabled = false;
    return;
  }
  submitBtn.disabled = false;

  if(isEdit){
    returnFromRsvpForm();
    return;
  }

  const number = padNum(insertedId);
  lastSubmission = { number, name, adults, children };
  notifyByEmail(number, name, adults, children);
  showComplete = true;
  formMode = false;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function startEditRsvp(id){
  const entry = rsvps.find(e=>String(e.id)===String(id));
  if(!entry) return;
  editingId = entry.id;
  cameFromAdmin = adminMode;
  adminMode = false;
  formMode = true;
  renderAll();
  document.getElementById('fName').value = entry.name;
  document.getElementById('fAdults').value = entry.adults;
  document.getElementById('fChildren').value = entry.children;
  document.getElementById('formTitle').textContent = '参加登録を編集';
  document.getElementById('submitBtn').textContent = '更新する';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteRsvp(id){
  if(!confirm('この参加登録を削除しますか？')) return;
  try{
    await apiFetch(`rsvps?id=eq.${id}`, { method: 'DELETE' });
    await refreshData();
  }catch(e){
    alert('通信エラーで削除できませんでした。電波状況を確認してもう一度お試しください。');
    return;
  }
  renderAll();
}

async function syncLoop(){
  setInterval(async ()=>{
    try{
      await refreshData();
      renderAll();
    }catch(e){ /* ignore transient network errors */ }
  }, SYNC_INTERVAL_MS);
}

async function init(){
  renderHeader();
  try{
    await refreshData();
  }catch(e){
    alert('データの読み込みに失敗しました。電波状況を確認して再読み込みしてください。');
  }
  renderAll();
  syncLoop();
}

init();
</script>
</body>
</html>
