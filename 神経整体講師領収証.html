<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="領収証">
<title>神経整体講師 領収証</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#eceae6; --paper:#fff; --ink:#1a1714; --sub:#6b6560;
    --line:#c9c4bd; --line-strong:#8a857e; --accent:#b8860b; --red:#c0392b;
    --head:#ececec; --btn:#2c3e50;
  }
  body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--ink);padding:0 0 80px;line-height:1.5;}

  /* ---- 操作バー（印刷時は非表示） ---- */
  .toolbar{position:sticky;top:0;z-index:50;background:var(--btn);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;}
  .toolbar h1{font-size:15px;font-weight:700;margin-right:auto;letter-spacing:.03em;}
  .toolbar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#fff;color:var(--btn);}
  .toolbar button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
  .toolbar .saved{font-size:12px;color:#bfe3c2;min-width:70px;}
  .toolbar .month-pick{font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;}
  .toolbar .month-pick input{font:inherit;font-size:13px;border:0;border-radius:8px;padding:6px 8px;}

  /* ---- 用紙 ---- */
  .sheet{max-width:820px;margin:18px auto;background:var(--paper);padding:38px 44px 30px;box-shadow:0 2px 14px rgba(0,0,0,.14);}
  .issue-date{text-align:right;font-size:14px;margin-bottom:6px;}
  .title{text-align:center;font-size:34px;font-weight:700;letter-spacing:.9em;padding-left:.9em;margin:6px 0 26px;}

  .top{display:flex;justify-content:space-between;gap:24px;margin-bottom:18px;}
  .party{font-size:13.5px;}
  .party .line{margin-bottom:2px;}
  .to-name{font-size:20px;font-weight:700;border-bottom:1px solid var(--ink);padding-bottom:3px;margin:8px 0;display:inline-block;min-width:240px;}
  .to-name .honor{font-size:15px;font-weight:400;margin-left:12px;}
  .from{min-width:270px;}
  .from .name{font-size:16px;font-weight:700;margin-bottom:4px;}
  .stamp{float:right;width:58px;height:58px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;margin-left:8px;opacity:.85;}

  .lead{font-size:13.5px;margin:14px 0 12px;}

  /* 領収金額 */
  .amount-box{display:flex;align-items:stretch;border:2px solid var(--ink);margin-bottom:22px;}
  .amount-box .lbl{background:var(--head);font-size:17px;font-weight:700;padding:14px 22px;display:flex;align-items:center;white-space:nowrap;border-right:2px solid var(--ink);}
  .amount-box .val{flex:1;font-size:28px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;letter-spacing:.04em;}

  .but{font-size:13.5px;margin-bottom:6px;}
  .but .u{border-bottom:1px solid var(--line-strong);padding:0 6px;}

  /* 明細テーブル */
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{border:1px solid var(--line);padding:6px 8px;}
  thead th{background:var(--head);font-weight:700;text-align:center;}
  .c-no{width:44px;text-align:center;}
  .c-qty{width:56px;text-align:center;}
  .c-price,.c-amt{width:110px;text-align:right;}
  td.c-name{text-align:left;}
  tfoot td{border:1px solid var(--line);}
  .sum-lbl{background:var(--head);text-align:center;font-weight:700;}
  .sum-val{text-align:right;}
  .discount{color:var(--red);}

  .note{margin-top:20px;font-size:12.5px;color:var(--sub);}
  .foot-stamp{margin-top:16px;display:flex;align-items:flex-end;gap:14px;}
  .inshi{width:88px;height:96px;border:1px dashed var(--line-strong);color:var(--sub);font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;}

  /* 編集フィールド共通 */
  [contenteditable]{outline:none;}
  .edit input,.edit textarea{font:inherit;color:inherit;border:0;background:transparent;width:100%;padding:1px 2px;}
  .edit input:focus,.edit textarea:focus,.edit [contenteditable]:focus{background:#fff7e0;border-radius:3px;}
  .edit td input{text-align:inherit;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  textarea{resize:none;overflow:hidden;}
  .hint{display:none;}
  .edit .hint{display:inline;font-size:11px;color:var(--accent);}

  /* 明細行の削除ボタン */
  .rowdel{width:26px;text-align:center;}
  .rowdel button{border:0;background:transparent;color:var(--red);font-size:15px;cursor:pointer;line-height:1;}
  .print-hide-col{display:none;}
  .edit .print-hide-col{display:table-cell;}

  @media(max-width:640px){
    .sheet{padding:22px 16px;margin:10px;}
    .title{font-size:26px;letter-spacing:.5em;padding-left:.5em;}
    .top{flex-direction:column;gap:12px;}
    .amount-box .val{font-size:22px;}
  }

  /* ---- 印刷 ---- */
  @media print{
    @page{size:A4 portrait;margin:14mm;}
    body{background:#fff;padding:0;}
    .toolbar{display:none !important;}
    .sheet{box-shadow:none;margin:0;max-width:none;padding:0;}
    .print-hide-col,.rowdel{display:none !important;}
    .hint{display:none !important;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>神経整体講師 領収証</h1>
  <label class="month-pick">対象月
    <input type="month" id="monthPick" onchange="applyMonth(this.value)">
  </label>
  <span class="saved" id="saved"></span>
  <button class="ghost" id="editBtn" onclick="toggleEdit()">編集</button>
  <button class="ghost" onclick="addRow()">＋行</button>
  <button class="ghost" onclick="resetAll()">初期化</button>
  <button onclick="window.print()">印刷 / PDF</button>
</div>

<div class="sheet" id="sheet">

  <div class="issue-date">発行日：<span class="fld" data-k="issueDate" contenteditable="false">2026/08/01</span></div>
  <div class="title">領　収　証</div>

  <div class="top">
    <!-- 宛先 -->
    <div class="party to">
      <div class="line"><span class="fld" data-k="toZip" contenteditable="false">〒662-0918</span></div>
      <div class="line"><span class="fld" data-k="toAddr1" contenteditable="false">兵庫県西宮市六湛寺町9番25号</span></div>
      <div class="line"><span class="fld" data-k="toAddr2" contenteditable="false">デルファーレ西宮1F</span></div>
      <div class="to-name">
        <span class="fld" data-k="toName" contenteditable="false">株式会社RUSTAR</span>
        <span class="honor fld" data-k="toHonor" contenteditable="false">御中</span>
      </div>
    </div>
    <!-- 発行者 -->
    <div class="party from">
      <div class="stamp">印</div>
      <div class="name"><span class="fld" data-k="fromName" contenteditable="false">つばき鍼灸整骨院</span></div>
      <div class="line"><span class="fld" data-k="fromZip" contenteditable="false">〒557-0044</span></div>
      <div class="line">住所：<span class="fld" data-k="fromAddr" contenteditable="false">大阪府大阪市西成区玉出中2-14-9</span></div>
      <div class="line">電話：<span class="fld" data-k="fromTel" contenteditable="false">06-7174-2209</span></div>
      <div class="line">担当：<span class="fld" data-k="fromStaff" contenteditable="false">松尾潤一</span></div>
      <div class="line">登録番号：<span class="fld" data-k="fromReg" contenteditable="false"></span></div>
    </div>
  </div>

  <div class="lead">下記の通り正に領収いたしました。</div>

  <div class="amount-box">
    <div class="lbl">領収金額</div>
    <div class="val" id="grandTop">¥0</div>
  </div>

  <div class="but">但し　<span class="u fld" data-k="but" contenteditable="false">神経整体 技術セミナー 講師料として</span></div>

  <table id="tbl">
    <thead>
      <tr>
        <th class="rowdel print-hide-col"></th>
        <th class="c-no">NO</th>
        <th>品　名</th>
        <th class="c-qty">数量</th>
        <th class="c-price">単価</th>
        <th class="c-amt">合計(税別)</th>
      </tr>
    </thead>
    <tbody id="rows"><!-- JSで生成 --></tbody>
    <tfoot>
      <tr>
        <td class="rowdel print-hide-col"></td>
        <td colspan="4" class="sum-lbl">小　計</td>
        <td class="sum-val" id="subtotal">¥0</td>
      </tr>
      <tr>
        <td class="rowdel print-hide-col"></td>
        <td colspan="4" class="sum-lbl">消費税（<span class="fld" data-k="taxRate" contenteditable="false">10</span>%）</td>
        <td class="sum-val" id="tax">¥0</td>
      </tr>
      <tr>
        <td class="rowdel print-hide-col"></td>
        <td colspan="4" class="sum-lbl">合　計</td>
        <td class="sum-val" id="grand">¥0</td>
      </tr>
    </tfoot>
  </table>

  <div class="foot-stamp">
    <div class="inshi">収入印紙</div>
    <div class="note">
      ※上記金額を領収いたしました。<br>
      内訳：課税対象額 <span id="netNote">¥0</span> ／ 消費税 <span id="taxNote">¥0</span>
    </div>
  </div>

</div>

<script>
const LS_KEY = 'shinkei_ryoshusho_v1';
const LS_MONTH = 'shinkei_ryoshusho_month';

// 既定の明細（画像の請求書を踏襲。品名は神経整体講師向けに調整）
const DEFAULT_ITEMS = [
  {name:'業務委託費　技術セミナー（徳島 第2日曜）令和8年6月分', qty:1, price:54927},
  {name:'業務委託費　技術セミナー（岡山.広島 第3水曜）令和8年6月分', qty:1, price:72505},
  {name:'業務委託費　技術セミナー（岡山.広島 7期生）令和8年6月分', qty:1, price:7200},
  {name:'会場費、交通費', qty:1, price:15893},
  {name:'値引き', qty:1, price:-4474},
];

const DEFAULT_FLD = {
  issueDate:'2026/08/01',
  toZip:'〒662-0918', toAddr1:'兵庫県西宮市六湛寺町9番25号', toAddr2:'デルファーレ西宮1F',
  toName:'株式会社RUSTAR', toHonor:'御中',
  fromName:'つばき鍼灸整骨院', fromZip:'〒557-0044', fromAddr:'大阪府大阪市西成区玉出中2-14-9',
  fromTel:'06-7174-2209', fromStaff:'松尾潤一', fromReg:'',
  but:'神経整体 技術セミナー 講師料として', taxRate:'10'
};

let items = [];
let editing = false;

const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');

function load(){
  let data = null;
  try{ data = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(data){
    items = data.items || JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    const f = data.fld || {};
    document.querySelectorAll('.fld').forEach(el=>{
      const k = el.dataset.k;
      if(f[k] !== undefined) el.textContent = f[k];
    });
  }else{
    items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  }
  // 前回選んだ対象月をピッカーに復元（内容は保存済みのものを尊重し上書きしない）
  const savedMonth = localStorage.getItem(LS_MONTH);
  if(savedMonth) document.getElementById('monthPick').value = savedMonth;
  renderRows();
}

function collectFld(){
  const f = {};
  document.querySelectorAll('.fld').forEach(el=> f[el.dataset.k] = el.textContent.trim());
  return f;
}

// 対象月を1つ選ぶと「発行日＝その月の1日」「各項目の〇月分＝その月」を一括反映
function applyMonth(ym){
  if(!ym) return;
  const [y, m] = ym.split('-').map(Number);
  const reg = /令和\s*\d+\s*年\s*\d+\s*月分/g;         // 「令和X年Y月分」
  const reg2 = /(?:令和\s*\d+\s*年\s*)?\d+\s*月分/g;   // 「Y月分」だけの表記も対象
  const rw = y - 2018;                                 // 西暦→令和
  const repl = `令和${rw}年${m}月分`;

  // 発行日 → その月の1日（YYYY/MM/01）
  const d = document.querySelector('[data-k="issueDate"]');
  if(d) d.textContent = `${y}/${String(m).padStart(2,'0')}/01`;

  // 各明細の「〇月分」をその月に
  items.forEach(it=>{
    if(typeof it.name === 'string' && /月分/.test(it.name)){
      it.name = it.name.match(reg) ? it.name.replace(reg, repl) : it.name.replace(reg2, repl);
    }
  });

  // 但し書き等の項目にも「〇月分」があれば反映
  document.querySelectorAll('.fld').forEach(el=>{
    if(el.dataset.k === 'issueDate') return;
    if(/月分/.test(el.textContent)){
      el.textContent = el.textContent.match(reg)
        ? el.textContent.replace(reg, repl)
        : el.textContent.replace(reg2, repl);
    }
  });

  localStorage.setItem(LS_MONTH, ym);
  document.getElementById('monthPick').value = ym;
  renderRows();
  save();
}

function save(){
  const payload = { items, fld: collectFld() };
  localStorage.setItem(LS_KEY, JSON.stringify(payload));
  const s = document.getElementById('saved');
  s.textContent = '保存しました';
  clearTimeout(save._t);
  save._t = setTimeout(()=> s.textContent='', 1600);
}

function renderRows(){
  const tb = document.getElementById('rows');
  tb.innerHTML = '';
  items.forEach((it, i)=>{
    const amt = (Number(it.qty)||0) * (Number(it.price)||0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rowdel print-hide-col"><button title="削除" onclick="delRow(${i})">✕</button></td>
      <td class="c-no">${i+1}</td>
      <td class="c-name">${
        editing ? `<input value="${escapeAttr(it.name)}" oninput="upd(${i},'name',this.value)">`
                : escapeHtml(it.name)
      }</td>
      <td class="c-qty">${
        editing ? `<input class="num" style="text-align:center" value="${it.qty}" oninput="upd(${i},'qty',this.value)">`
                : (it.qty!=='' ? it.qty : '')
      }</td>
      <td class="c-price num">${
        editing ? `<input class="num" value="${it.price}" oninput="upd(${i},'price',this.value)">`
                : (it.price!=='' ? yen(it.price) : '')
      }</td>
      <td class="c-amt num ${amt<0?'discount':''}">${amt<0 ? '('+Math.abs(amt).toLocaleString('ja-JP')+')' : yen(amt)}</td>`;
    tb.appendChild(tr);
  });
  recalc();
}

function upd(i, key, val){
  if(key==='name') items[i].name = val;
  else items[i][key] = val==='' ? '' : Number(val);
  // 金額欄だけ即時更新
  recalc();
  const cell = document.querySelectorAll('#rows tr')[i].querySelector('.c-amt');
  const amt = (Number(items[i].qty)||0)*(Number(items[i].price)||0);
  cell.textContent = amt<0 ? '('+Math.abs(amt).toLocaleString('ja-JP')+')' : yen(amt);
  cell.classList.toggle('discount', amt<0);
  save();
}

function recalc(){
  const sub = items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0);
  const rate = Number((document.querySelector('[data-k="taxRate"]').textContent||'0').replace(/[^\d.]/g,''))/100;
  const tax = Math.ceil(sub * rate); // 消費税は切り上げ（見本の運用に合わせる）
  const grand = sub + tax;
  document.getElementById('subtotal').textContent = yen(sub);
  document.getElementById('tax').textContent = yen(tax);
  document.getElementById('grand').textContent = yen(grand);
  document.getElementById('grandTop').textContent = yen(grand);
  document.getElementById('netNote').textContent = yen(sub);
  document.getElementById('taxNote').textContent = yen(tax);
}

function addRow(){
  items.push({name:'', qty:1, price:0});
  if(!editing) toggleEdit(true);
  else renderRows();
  save();
}

function delRow(i){
  items.splice(i,1);
  renderRows();
  save();
}

function toggleEdit(force){
  editing = (force===true) ? true : !editing;
  document.getElementById('sheet').classList.toggle('edit', editing);
  document.getElementById('editBtn').textContent = editing ? '編集終了' : '編集';
  document.querySelectorAll('.fld').forEach(el=> el.setAttribute('contenteditable', editing));
  renderRows();
}

function resetAll(){
  if(!confirm('入力内容を初期状態（見本）に戻します。よろしいですか？')) return;
  localStorage.removeItem(LS_KEY);
  items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  document.querySelectorAll('.fld').forEach(el=>{
    const k = el.dataset.k;
    el.textContent = DEFAULT_FLD[k] !== undefined ? DEFAULT_FLD[k] : '';
  });
  renderRows();
}

function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// フィールド編集の保存＆再計算
document.addEventListener('input', e=>{
  if(e.target.classList && e.target.classList.contains('fld')){
    if(e.target.dataset.k==='taxRate') recalc();
    save();
  }
});
document.addEventListener('blur', e=>{
  if(e.target.classList && e.target.classList.contains('fld')) save();
}, true);

load();
</script>
</body>
</html>
